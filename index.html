<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffe6f0">
  <title>Dreamy Diaries - Lock Screen 💖</title>
  <link rel="icon" type="image/png" href="assets/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <!-- Decorative background -->
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
  </div>

  <main class="lock-container">
    <img class="lock-crest" src="assets/favicon-192.png" width="72" height="72" alt="" />
    <div class="glow-title">Premii 💖</div>
    <h2>Enter Password</h2>
    <div class="hint-text">💭 Hint: What I like to call you 💭</div>

    <form id="lockForm" autocomplete="off" novalidate>
      <div class="error" id="error" role="alert" aria-live="polite"></div>
      <div class="password-container">
        <input type="password" id="password" placeholder="🔐 Password" autofocus
               autocomplete="current-password" aria-label="Password" />
        <button type="button" class="toggle-btn" id="toggleBtn" aria-label="Show password" aria-pressed="false">
          <span id="toggleIcon" aria-hidden="true">👁️</span>
          <span id="toggleText">Show</span>
        </button>
      </div>
      <button type="submit" class="unlock-btn" id="unlockBtn">✨ Unlock ✨</button>
    </form>
  </main>

  <script src="js/index.js"></script>
</body>
</html>
